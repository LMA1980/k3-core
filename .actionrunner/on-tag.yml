version: "1"
name: "k3-core Release Pipeline"

env:
  CARGO_TERM_COLOR: always

steps:
  - name: "Verify Rust Formatting (cargo fmt)"
    run: "cargo fmt --check"
    timeout_seconds: 120

  - name: "Verify Rust Linter & Clippy Rules (cargo clippy)"
    run: "cargo clippy --all-targets -- -D warnings"
    timeout_seconds: 300

  - name: "Evaluate Test Suite & Line Code Coverage (cargo llvm-cov)"
    run: "cargo llvm-cov --summary-only"
    timeout_seconds: 300

  - name: "Build Production Optimized Library"
    run: "cargo build --release"
    timeout_seconds: 600
