version: "1"
name: "k3-core Factory Pipeline: Hygiene, Tests, Coverage & Benchmarks"

env:
  CARGO_TERM_COLOR: always

steps:
  - name: "Synchronize Dependencies & Workspace Bridge"
    run: |
            mkdir -p ..
      for repo in k3-core k3-arch-synthetic k3-kernels-rvv k3-tokenizer k3-kv k3-engine k3-manager; do
        if [ ! -d "../$repo/.git" ]; then
          git clone --depth 1 https://github.com/LMA1980/$repo.git ../$repo || true
        fi
      done
      
      cat << "EOF" > ../Cargo.toml
      [workspace]
      resolver = "2"
      members = [
          "k3-arch-synthetic",
          "k3-core",
          "k3-engine",
          "k3-kernels-rvv",
          "k3-kv",
          "k3-manager",
          "k3-tokenizer",
      ]
      
      [workspace.package]
      version = "0.1.0"
      edition = "2024"
      rust-version = "1.85"
      license = "AGPL-3.0-only"
      
      [workspace.dependencies]
      arch-synthetic = { path = "k3-arch-synthetic" }
      k3-core = { path = "k3-core" }
      k3-engine = { path = "k3-engine" }
      kernels-rvv = { path = "k3-kernels-rvv" }
      k3-kv = { path = "k3-kv" }
      k3-manager = { path = "k3-manager" }
      k3-tokenizer = { path = "k3-tokenizer" }
      arrow-array = "59.3.1"
      arrow-buffer = "59.3.1"
      fory = "1.7.7"
      fory-derive = "1.7.7"
      libc = "0.2"
      rayon = "1.12"
      sendfd = "0.4.5"
      serde = { version = "1.0", features = ["derive"] }
      serde_json = "1.0"
      tokio = { version = "1.54.1", features = ["process", "rt", "net", "io-util", "sync", "macros", "signal"] }
      zerocopy = { version = "0.8.63", features = ["derive"] }
      
      [workspace.lints.rust]
      unsafe_op_in_unsafe_fn = "deny"
      missing_debug_implementations = "warn"
      unreachable_pub = "warn"
      unused_qualifications = "warn"
      
      [workspace.lints.clippy]
      all = { level = "warn", priority = -1 }
      pedantic = { level = "warn", priority = -1 }
      undocumented_unsafe_blocks = "warn"
      EOF
      
      cargo generate-lockfile --manifest-path ../Cargo.toml || true
    timeout_seconds: 180

  - name: "Verify Rust Formatting (cargo fmt)"
    run: "cargo fmt --check"
    timeout_seconds: 120

  - name: "Verify Rust Linter & Clippy Rules (cargo clippy)"
    run: "cargo clippy --package k3-core --all-targets -- -D warnings"
    timeout_seconds: 300

  - name: "Verify Dependencies Security Advisories (cargo audit)"
    run: "cargo audit --file ../Cargo.lock"
    timeout_seconds: 180

  - name: "Evaluate Test Suite & Line Code Coverage (cargo llvm-cov)"
    run: "cargo llvm-cov --package k3-core --summary-only"
    timeout_seconds: 300

  - name: "Verify Safe Execution & Undefined Behavior via Miri (cargo +nightly miri test)"
    run: "cargo +nightly miri test -p k3-core --lib"
    timeout_seconds: 300

  - name: "Execute Native Micro-Benchmarks (cargo bench)"
    run: "cargo bench --package k3-core || true"
    timeout_seconds: 300
